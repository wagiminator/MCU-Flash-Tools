[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name         = "tinypro"
version      = "1.0.0"
description  = "Programming Tool for (E)EPROMs and Flash Memory ICs via XGecu TL866A, TL866CS, TL866II+, T48 and T56"
keywords     = ["EPROM", "EEPROM", "flash", "SPI flash", "TL866", "TL866II+", "T48", "T56", "XGecu", "minipro", "programmer"]
dependencies = ["pyusb", "libusb-package; platform_system == 'Windows'"]
requires-python = ">=3.8"
authors = [
    { name="Stefan Wagner", email="wagiminator@web.de" },
]
maintainers = [
    { name="Stefan Wagner", email="wagiminator@web.de" },
]
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Embedded Systems",
]

[project.scripts]
tinypro = "tinypro.tinypro:_main"

[project.urls]
Homepage   = "https://wagiminator.github.io/"
Repository = "https://github.com/wagiminator/MCU-Flash-Tools"
Issues     = "https://github.com/wagiminator/MCU-Flash-Tools/issues"
